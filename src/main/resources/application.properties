# Application & Server
spring.application.name=sportyaviation
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# Enable Java Virtual Threads for high-concurrency blocking I/O
spring.threads.virtual.enabled=true

# Expose RFC 7807 ProblemDetail fields cleanly
spring.mvc.problemdetails.enabled=true

# Auto-configured RestClient timeouts
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=3s

# Upstream AviationWeather.gov Client Configuration
aviation.weather.base-url=https://aviationweather.gov/api/data
aviation.weather.user-agent=sporty-aviation-wrapper/1.0

# Caffeine Cache
spring.cache.type=caffeine
spring.cache.cache-names=airports
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h,recordStats

# Resilience4j: Retry & Circuit Breaker (Cache -> Circuit Breaker -> Retry -> HTTP Call)
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.retry.retry-aspect-order=2

resilience4j.retry.instances.aviationWeather.max-attempts=3
resilience4j.retry.instances.aviationWeather.wait-duration=300ms
resilience4j.retry.instances.aviationWeather.enable-exponential-backoff=true
resilience4j.retry.instances.aviationWeather.exponential-backoff-multiplier=2
resilience4j.retry.instances.aviationWeather.enable-randomized-wait=true
resilience4j.retry.instances.aviationWeather.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException,org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.HttpClientErrorException$TooManyRequests
# resilience4j.retry.instances.aviationWeather.ignore-exceptions=NotFoundException

resilience4j.circuitbreaker.instances.aviationWeather.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.aviationWeather.sliding-window-size=10
resilience4j.circuitbreaker.instances.aviationWeather.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.aviationWeather.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aviationWeather.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.aviationWeather.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.aviationWeather.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.aviationWeather.record-exceptions=java.io.IOException,java.util.concurrent.TimeoutException,org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.HttpClientErrorException$TooManyRequests
# resilience4j.retry.instances.aviationWeather.ignore-exceptions=NotFoundException

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.circuitbreakers.enabled=true